        match: "https://juan-nikola.github.io/apple-proxy-profiles/current/egern/rules/ChinaMax_Domain.yaml"
        value: "china"
        update_interval: 86400
    - domain_wildcard:
        match: "*"
        value: "global"
  proxy_nameservers:
    - "system"
