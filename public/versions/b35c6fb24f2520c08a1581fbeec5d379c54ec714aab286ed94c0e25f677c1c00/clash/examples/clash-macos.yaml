mixed-port: 7890
allow-lan: false
mode: "rule"
log-level: "warning"
ipv6: true
disable-quic: false
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
tun:
  enable: true
  stack: "mixed"
  auto-route: true
  auto-detect-interface: true
proxies:
  - name: "SS 2022"
    type: "ss"
    server: "ss-2022.example.invalid"
    port: 443
    cipher: "2022-blake3-aes-128-gcm"
    password: "TEST_ONLY_SS_2022_KEY"
    udp: true
  - name: "SS Alias"
    type: "ss"
    server: "ss-alias.example.invalid"
    port: 443
    cipher: "aes-256-gcm"
    password: "TEST_ONLY_SS_ALIAS_PASSWORD"
    udp: false
  - name: "Snell V4"
    type: "snell"
    server: "snell-v4.example.invalid"
    port: 443
    psk: "TEST_ONLY_SNELL_PSK"
    version: 4
    reuse: true
    obfs: "tls"
    obfs-host: "snell-obfs.example.invalid"
    udp: true
  - name: "VMess Raw"
    type: "vmess"
    server: "vmess-raw.example.invalid"
    port: 443
    uuid: "00000000-0000-4000-8000-000000000001"
    cipher: "auto"
    udp: true
  - name: "VMess TLS"
    type: "vmess"
    server: "vmess-tls.example.invalid"
    port: 443
    uuid: "00000000-0000-4000-8000-000000000001"
    cipher: "aes-128-gcm"
    tls: true
    servername: "vmess-tls.example.invalid"
    skip-cert-verify: false
  - name: "VMess WSS"
    type: "vmess"
    server: "vmess-wss.example.invalid"
    port: 443
    uuid: "00000000-0000-4000-8000-000000000001"
    cipher: "chacha20-poly1305"
    tls: true
    servername: "vmess-wss.example.invalid"
    network: "ws"
    ws-opts:
      path: "/vmess"
      headers:
        Host: "vmess-host.example.invalid"
  - name: "VMess gRPC"
    type: "vmess"
    server: "vmess-grpc.example.invalid"
    port: 443
    uuid: "00000000-0000-4000-8000-000000000001"
    cipher: "none"
    tls: true
    servername: "vmess-grpc.example.invalid"
    network: "grpc"
    grpc-opts:
      grpc-service-name: "VMessService"
  - name: "VMess HTTP1"
    type: "vmess"
    server: "vmess-http1.example.invalid"
    port: 443
    uuid: "00000000-0000-4000-8000-000000000001"
    cipher: "zero"
    network: "http"
    http-opts:
      method: "GET"
      path:
        - "/vmess-http"
      headers:
        Host:
          - "vmess-http.example.invalid"
  - name: "VLESS Raw"
    type: "vless"
    server: "vless-raw.example.invalid"
    port: 443
    uuid: "00000000-0000-4000-8000-000000000001"
    udp: false
  - name: "VLESS Reality"
    type: "vless"
    server: "vless-reality.example.invalid"
    port: 443
    uuid: "00000000-0000-4000-8000-000000000001"
    flow: "xtls-rprx-vision"
    udp: true
    tls: true
    servername: "www.example.com"
    reality-opts:
      public-key: "TEST_ONLY_REALITY_PUBLIC_KEY"
      short-id: "0123abcd"
  - name: "VLESS WSS"
    type: "vless"
    server: "vless-wss.example.invalid"
    port: 443
    uuid: "00000000-0000-4000-8000-000000000001"
    tls: true
    servername: "vless-wss.example.invalid"
    network: "ws"
    ws-opts:
      path: "/vless"
      headers:
        Host: "vless-host.example.invalid"
  - name: "VLESS gRPC Reality"
    type: "vless"
    server: "vless-grpc-reality.example.invalid"
    port: 443
    uuid: "00000000-0000-4000-8000-000000000001"
    tls: true
    servername: "www.example.com"
    reality-opts:
      public-key: "TEST_ONLY_GRPC_REALITY_PUBLIC_KEY"
    network: "grpc"
    grpc-opts:
      grpc-service-name: "VlessService"
  - name: "VLESS HTTP2"
    type: "vless"
    server: "vless-http2.example.invalid"
    port: 443
    uuid: "00000000-0000-4000-8000-000000000001"
    tls: true
    servername: "vless-h2.example.invalid"
    network: "h2"
    h2-opts:
      method: "GET"
      path: "/vless-h2"
      host:
        - "vless-h2-host.example.invalid"
      headers:
        Accept: "*/*"
  - name: "Trojan TLS"
    type: "trojan"
    server: "trojan-tls.example.invalid"
    port: 443
    password: "TEST_ONLY_TROJAN_PASSWORD"
    udp: true
    servername: "trojan.example.invalid"
    skip-cert-verify: false
  - name: "Trojan WebSocket"
    type: "trojan"
    server: "trojan-websocket.example.invalid"
    port: 443
    password: "TEST_ONLY_TROJAN_WS_PASSWORD"
    servername: "trojan-ws.example.invalid"
    network: "ws"
    ws-opts:
      path: "/trojan"
      headers:
        Host: "trojan-host.example.invalid"
  - name: "Trojan Reality"
    type: "trojan"
    server: "trojan-reality.example.invalid"
    port: 443
    password: "TEST_ONLY_TROJAN_REALITY_PASSWORD"
    tls: true
    servername: "www.example.com"
    reality-opts:
      public-key: "TEST_ONLY_TROJAN_REALITY_PUBLIC_KEY"
      short-id: "abcd"
  - name: "AnyTLS"
    type: "anytls"
    server: "anytls.example.invalid"
    port: 443
    password: "TEST_ONLY_ANYTLS_PASSWORD"
    udp: true
    servername: "anytls.example.invalid"
    skip-cert-verify: false
  - name: "Hysteria2"
    type: "hysteria2"
    server: "hysteria2.example.invalid"
    port: 443
    password: "TEST_ONLY_HYSTERIA2_AUTH"
    obfs: "salamander"
    obfs-password: "TEST_ONLY_HYSTERIA2_OBFS_PASSWORD"
    ports: "20000-30000"
    hop-interval: 30
    up: 100
    servername: "hysteria2.example.invalid"
  - name: "Hysteria2 Alias"
    type: "hysteria2"
    server: "hysteria2-alias.example.invalid"
    port: 443
    password: "TEST_ONLY_HY2_AUTH"
    servername: "hy2.example.invalid"
  - name: "TUIC"
    type: "tuic"
    server: "tuic.example.invalid"
    port: 443
    uuid: "00000000-0000-4000-8000-000000000001"
    password: "TEST_ONLY_TUIC_PASSWORD"
    udp-relay-mode: "native"
    alpn:
      - "h3"
    port-hopping: "443,445,447"
    port-hopping-interval: 30
    servername: "tuic.example.invalid"
    skip-cert-verify: true
  - name: "SOCKS5"
    type: "socks5"
    server: "socks5.example.invalid"
    port: 443
    username: "TEST_ONLY_SOCKS_USERNAME"
    password: "TEST_ONLY_SOCKS_PASSWORD"
    udp: true
  - name: "SOCKS5 TLS"
    type: "socks5"
    server: "socks5-tls.example.invalid"
    port: 443
    username: "TEST_ONLY_SOCKS_TLS_USERNAME"
    password: "TEST_ONLY_SOCKS_TLS_PASSWORD"
    tls: true
    servername: "socks-tls.example.invalid"
    skip-cert-verify: false
  - name: "HTTP"
    type: "http"
    server: "http.example.invalid"
    port: 443
    username: "TEST_ONLY_HTTP_USERNAME"
    password: "TEST_ONLY_HTTP_PASSWORD"
  - name: "HTTPS"
    type: "https"
    server: "https.example.invalid"
    port: 443
    username: "TEST_ONLY_HTTPS_USERNAME"
    password: "TEST_ONLY_HTTPS_PASSWORD"
    headers:
      User-Agent: "TEST_ONLY_HTTP_AGENT"
    tls: true
    servername: "https.example.invalid"
    skip-cert-verify: false
  - name: "SSH"
    type: "ssh"
    server: "ssh.example.invalid"
    port: 443
    username: "TEST_ONLY_SSH_USERNAME"
    password: "TEST_ONLY_SSH_PASSWORD"
    private-key: "TEST_ONLY_SSH_PRIVATE_KEY"
    host-keys:
      - "ssh-ed25519 TEST_ONLY_SSH_HOST_KEY"
    tfo: true
  - name: "WireGuard IPv4"
    type: "wireguard"
    server: "wireguard-ipv4.example.invalid"
    port: 443
    private-key: "TEST_ONLY_WIREGUARD_PRIVATE_KEY"
    public-key: "TEST_ONLY_WIREGUARD_PUBLIC_KEY"
    pre-shared-key: "TEST_ONLY_WIREGUARD_PRESHARED_KEY"
    reserved:
      - 1
      - 2
      - 3
    ip: "192.0.2.2/32"
    dns:
      - "192.0.2.53"
    mtu: 1280
    keepalive: 25
  - name: "WireGuard IPv6"
    type: "wireguard"
    server: "wireguard-ipv6.example.invalid"
    port: 443
    private-key: "TEST_ONLY_WIREGUARD_V6_PRIVATE_KEY"
    public-key: "TEST_ONLY_WIREGUARD_V6_PUBLIC_KEY"
    ipv6: "2001:db8::2/128"
