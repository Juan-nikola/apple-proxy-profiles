name: Update Rules

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-rules.yml"
      - "automation/**"
      - "clients/**"
      - "scripts/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs: {}

permissions: {}

concurrency:
  # Re-run the canonical release build after merged generator changes.
  group: rule-update-main
  cancel-in-progress: false

jobs:
  build-current:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install verified official sing-box core
        run: node scripts/install-sing-box-core.mjs
      - name: Fetch immutable ChinaIP audit and stage lightweight rules
        run: node scripts/stage-rule-artifacts.mjs --channel current
      - name: Compile binary sing-box rule sets
        run: npm --workspace @apple-proxy-profiles/sing-box run compile:rules
      - name: Generate deterministic client inputs
        run: npm run fixtures && npm run build
      - name: Check light and diagnostic sing-box profiles
        run: npm --workspace @apple-proxy-profiles/sing-box run check:config
      - name: Verify lightweight semantics and budgets
        run: npm run verify:lightweight
      - name: Verify repository
        run: npm run verify
      - name: Require canonical tracked generators
        run: git diff --exit-code -- . ":(exclude)public/**"
      - name: Publish current from the tested binaries
        run: npm run update:rules
      - name: Verify current rules
        run: npm run check:rules
      - name: Scan published output
        run: npm run check:secrets
      - name: Sync public audit blocker issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-audit-blocker-issues.mjs
      - name: Commit current release changes
        shell: bash
        run: |
          if git diff --quiet -- public; then
            echo "Public release channels are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update current rule release"
          git push origin main
