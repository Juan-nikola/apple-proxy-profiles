name: Update Rules

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: rule-update-main
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify repository
        run: npm run verify
      - name: Require canonical tracked generators
        run: git diff --exit-code -- . ":(exclude)public/**"
      - name: Update public rules
        run: npm run update:rules
      - name: Verify pinned rules
        run: npm run check:rules
      - name: Scan public output
        run: npm run check:secrets
      - name: Commit public rule changes
        shell: bash
        run: |
          if git diff --quiet -- public; then
            echo "Public rules are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update public rules"
          git push origin main
