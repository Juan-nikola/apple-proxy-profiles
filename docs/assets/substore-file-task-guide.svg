<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <rect width="1200" height="660" fill="#f8fafc"/>
  <rect x="30" y="24" width="1140" height="612" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="30" y="24" width="1140" height="58" rx="8" fill="#0f172a"/>
  <text x="60" y="60" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Sub-Store · File 任务（界面示意）</text>
  <g font-family="Arial, sans-serif" font-size="17">
    <text x="72" y="124" fill="#334155">名称</text>
    <rect x="230" y="96" width="870" height="42" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="250" y="124" fill="#0f172a">surge-config-iphone</text>
    <text x="72" y="184" fill="#334155">显示名称</text>
    <rect x="230" y="156" width="870" height="42" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="250" y="184" fill="#0f172a">Surge iPhone</text>
    <text x="72" y="244" fill="#334155">类型 / 来源</text>
    <rect x="230" y="216" width="180" height="42" rx="4" fill="#e2e8f0"/>
    <text x="254" y="244" fill="#334155">文件</text>
    <rect x="430" y="216" width="180" height="42" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="454" y="244" fill="#166534">远程</text>
    <text x="72" y="302" fill="#334155">链接</text>
    <rect x="230" y="274" width="870" height="92" rx="4" fill="#f8fafc" stroke="#22c55e" stroke-width="2"/>
    <text x="250" y="303" fill="#166534">https://juan-nikola.github.io/apple-proxy-profiles/current/</text>
    <text x="250" y="331" fill="#166534">surge/scripts/surge-profile-generator.js#output=config&amp;...</text>
    <text x="72" y="408" fill="#334155">参数规则</text>
    <rect x="230" y="380" width="870" height="74" rx="4" fill="#f1f5f9"/>
    <text x="250" y="409" fill="#334155">参数放在 # 后，使用 &amp; 分隔；不要写成 ?output=config。</text>
    <text x="250" y="437" fill="#334155">生产任务使用 current；noCache 和 insecure 保持关闭。</text>
    <rect x="230" y="488" width="190" height="46" rx="5" fill="#2563eb"/>
    <text x="282" y="518" fill="#ffffff" font-weight="700">Preview</text>
    <rect x="440" y="488" width="190" height="46" rx="5" fill="#16a34a"/>
    <text x="498" y="518" fill="#ffffff" font-weight="700">保存</text>
  </g>
  <text x="60" y="590" fill="#64748b" font-family="Arial, sans-serif" font-size="15">示意图不含真实订阅地址、节点、账号或 API Token；私密输出 URL 只在你的 Sub-Store 和设备中使用。</text>
</svg>
