<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">更新失败时的回滚流程</title>
  <desc id="desc">检测、切换本地旧配置、修复同一 current 任务、重新导入的四步流程。</desc>
  <defs><filter id="shadow" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker></defs>
  <rect width="1200" height="520" fill="#fffbeb"/><text x="60" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="700" fill="#78350f">更新失败：保持同一条 current 链路</text><text x="60" y="101" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#92400e">不要临时换成未知脚本，也不要把私密节点复制到公开 Issue。</text>
  <g filter="url(#shadow)"><rect x="55" y="150" width="245" height="275" rx="12" fill="#fff"/><rect x="330" y="150" width="245" height="275" rx="12" fill="#fff"/><rect x="605" y="150" width="245" height="275" rx="12" fill="#fff"/><rect x="880" y="150" width="265" height="275" rx="12" fill="#fff"/></g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><text x="80" y="200" font-size="20" font-weight="700" fill="#0f172a">1. 预览诊断</text><text x="80" y="245" font-size="15" fill="#475569">检查 preview 是否为空</text><text x="80" y="277" font-size="15" fill="#475569">确认 renderFailures</text><text x="80" y="309" font-size="15" fill="#475569">核对 manifest hash</text><text x="80" y="365" font-size="14" fill="#b45309">失败即停止导入</text>
  <text x="355" y="200" font-size="20" font-weight="700" fill="#0f172a">2. 切旧配置</text><text x="355" y="245" font-size="15" fill="#475569">Surge 切换本地旧 Profile</text><text x="355" y="277" font-size="15" fill="#475569">保持设备可用</text><text x="355" y="365" font-size="14" fill="#b45309">不要删除旧配置</text>
  <text x="630" y="200" font-size="20" font-weight="700" fill="#0f172a">3. 修复任务</text><text x="630" y="245" font-size="15" fill="#475569">移除不兼容节点</text><text x="630" y="277" font-size="15" fill="#475569">修正同一 collection</text><text x="630" y="309" font-size="15" fill="#475569">重新 Preview current</text>
  <text x="905" y="200" font-size="20" font-weight="700" fill="#0f172a">4. 重新导入</text><text x="905" y="245" font-size="15" fill="#475569">沿用原 Profile URL</text><text x="905" y="277" font-size="15" fill="#475569">验证国内/海外分流</text><text x="905" y="309" font-size="15" fill="#475569">确认自动更新恢复</text></g>
  <path d="M305 287H320" stroke="#b45309" stroke-width="4" marker-end="url(#arrow)"/><path d="M580 287H595" stroke="#b45309" stroke-width="4" marker-end="url(#arrow)"/><path d="M855 287H870" stroke="#b45309" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
