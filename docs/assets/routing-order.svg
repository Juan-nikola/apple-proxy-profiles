<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">统一路由顺序</title>
  <desc id="desc">请求先匹配 ChinaTLD，再匹配 ChinaIP，最后进入默认代理。</desc>
  <defs><filter id="shadow" x="-10%" y="-15%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="440" fill="#eff6ff"/><text x="60" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="700" fill="#1e3a8a">所有客户端使用同一条分流逻辑</text><text x="60" y="101" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#1e40af">先判断域名，再用 IP 结果兜底，最终才进入代理。</text>
  <g filter="url(#shadow)"><rect x="70" y="165" width="250" height="180" rx="12" fill="#fff"/><rect x="475" y="165" width="250" height="180" rx="12" fill="#fff"/><rect x="880" y="165" width="250" height="180" rx="12" fill="#fff"/></g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><text x="195" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">ChinaTLD</text><text x="195" y="255" text-anchor="middle" font-size="15" fill="#475569">.cn / 国内域名</text><text x="195" y="295" text-anchor="middle" font-size="14" fill="#2563eb">DIRECT</text><text x="600" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">ChinaIP</text><text x="600" y="255" text-anchor="middle" font-size="15" fill="#475569">解析到中国 IP</text><text x="600" y="295" text-anchor="middle" font-size="14" fill="#2563eb">DIRECT</text><text x="1005" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">默认代理</text><text x="1005" y="255" text-anchor="middle" font-size="15" fill="#475569">未命中前两层</text><text x="1005" y="295" text-anchor="middle" font-size="14" fill="#2563eb">PROXY</text></g>
  <path d="M330 255H465" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><path d="M735 255H870" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
